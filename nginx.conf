# Mirrors the Vercel config: SPA fallback, gateway rewrites, and the same cache headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  resolver 169.254.169.254 valid=30s;   # Cloud Run metadata resolver

  # vercel.json: /assets/(.*) -> immutable 1 year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # vercel.json rewrites -> https://gateway.pivota.cc/...
  location /v1/      { proxy_pass https://gateway.pivota.cc; proxy_ssl_server_name on; proxy_set_header Host gateway.pivota.cc; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location /v2/      { proxy_pass https://gateway.pivota.cc; proxy_ssl_server_name on; proxy_set_header Host gateway.pivota.cc; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location = /health  { proxy_pass https://gateway.pivota.cc/health;  proxy_ssl_server_name on; proxy_set_header Host gateway.pivota.cc; }
  location = /healthz { proxy_pass https://gateway.pivota.cc/healthz; proxy_ssl_server_name on; proxy_set_header Host gateway.pivota.cc; }
  location = /metrics { proxy_pass https://gateway.pivota.cc/metrics; proxy_ssl_server_name on; proxy_set_header Host gateway.pivota.cc; }

  # vercel.json: /(.*) -> /index.html (SPA fallback), everything no-store
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
